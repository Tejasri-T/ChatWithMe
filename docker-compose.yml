services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chatbot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/chatbot
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chatbot-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://api:8000/api/v1
    depends_on:
      - api
    networks:
      - chatbot-network

volumes:
  postgres_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
